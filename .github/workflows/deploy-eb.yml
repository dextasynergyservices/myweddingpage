name: Deploy to Elastic Beanstalk

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Prepare deployment bundle
        run: |
          # Create zip with ALL source files needed for building
          zip -r weddingpage.zip \
            . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".github/*" \
            -x ".next/*"

          # Verify critical directories are included
          echo "=== Verifying source files are included ==="
          unzip -l weddingpage.zip | grep -E "(src/|prisma/|package.json|next.config)" | head -10
          echo "=== Total files in zip ==="
          unzip -l weddingpage.zip | wc -l

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "weddingpage"
          environment_name: "Weddingpage-env"
          region: "eu-central-1"
          version_label: "build-${{ github.run_number }}"
          deployment_package: "weddingpage.zip"
